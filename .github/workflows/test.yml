# Preparation only. Temporary diagnostics branch; never merge into product.
name: Temporary source-ingest timeout control (never merge)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  timeout-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: candidate-predecessors
          ref: 7f251c76eccc7a06f737c6c89de455fccec32b7f
    env:
      EVIDENCE: ${{ github.workspace }}/timeout-control-evidence
      EXPECTED_SHA: ${{ matrix.ref }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Initialize evidence
      run: |
        set -euo pipefail
        mkdir -p "$EVIDENCE"
        printf '%s\n' "$EXPECTED_SHA" > "$EVIDENCE/expected-sha.txt"
        printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE/workflow-sha.txt"
        printf '%s\n' "$GITHUB_RUN_ID" > "$EVIDENCE/run-id.txt"
        printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE/run-attempt.txt"
        printf '%s\n' 'not-started' > "$EVIDENCE/exit-status.txt"
        printf '%s\n' "timeout --signal=TERM --kill-after=5s 90s bun test test/source-ingest-executor.test.ts --test-name-pattern 'SQL transform aborts long-running work without blocking other JS timers|SQL transform rejects missing and null primary keys instead of row-N fallback|failed rows are retried on next transform run'" > "$EVIDENCE/command.txt"
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: Vyacheslav-Zakharov/gbrain
        ref: ${{ matrix.ref }}
        path: source
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - name: Verify exact source and frozen install
      timeout-minutes: 5
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/source"
        git rev-parse HEAD > "$EVIDENCE/source-sha.txt"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        bun --version > "$EVIDENCE/bun-version.txt"
        test "$(bun --version)" = '1.3.13'
        git ls-files -s test/source-ingest-executor.test.ts bunfig.toml test/helpers/legacy-embedding-preload.ts bun.lock > "$EVIDENCE/source-blobs.txt"
        bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install-output.txt"
        git diff --exit-code
    - name: Single unchanged test in loopback-only namespace
      timeout-minutes: 3
      run: |
        set -euo pipefail
        source_dir="$GITHUB_WORKSPACE/source"
        sandbox="$RUNNER_TEMP/timeout-control"
        mkdir -p "$sandbox/home" "$sandbox/gbrain" "$sandbox/tmp"
        bun_path="$(command -v bun)"
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        host_net="$(readlink /proc/self/ns/net)"
        cat > "$sandbox/root.sh" <<'ROOT'
        set -euo pipefail
        uid="$1"; gid="$2"; sandbox="$3"; shift 3
        ip link set lo up
        exec setpriv --reuid="$uid" --regid="$gid" --clear-groups \
          --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
          /usr/bin/env -i PATH="$(dirname "$4"):/usr/bin:/bin" \
          HOME="$sandbox/home" GBRAIN_HOME="$sandbox/gbrain" TMPDIR="$sandbox/tmp" \
          /bin/bash --noprofile --norc "$sandbox/user.sh" "$uid" "$gid" "$@"
        ROOT
        cat > "$sandbox/user.sh" <<'USER'
        set -euo pipefail
        uid="$1"; gid="$2"; source_dir="$3"; evidence="$4"; host_net="$5"; bun_path="$6"
        cd "$source_dir"
        unset OLDPWD
        # Fail closed before Bun starts. No inherited credentials or host network.
        python3 - "$uid" "$gid" "$host_net" > "$evidence/network-proof.json" <<'PY'
        import json, os, subprocess, sys
        uid, gid = map(int, sys.argv[1:3])
        net = os.readlink('/proc/self/ns/net')
        links = json.loads(subprocess.check_output(['ip', '-j', 'link']))
        routes4 = json.loads(subprocess.check_output(['ip', '-j', '-4', 'route', 'show', 'table', 'all']))
        routes6 = json.loads(subprocess.check_output(['ip', '-j', '-6', 'route', 'show', 'table', 'all']))
        status = dict(line.strip().split(':', 1) for line in open('/proc/self/status') if ':' in line)
        caps = {k: status[k].strip() for k in ['CapInh','CapPrm','CapEff','CapBnd','CapAmb','NoNewPrivs','Groups']}
        proof = dict(host_namespace=sys.argv[3], test_namespace=net, uid=os.getuid(), euid=os.geteuid(), gid=os.getgid(), egid=os.getegid(), links=links, routes4=routes4, routes6=routes6, privileges=caps, environment_keys=sorted(os.environ))
        print(json.dumps(proof, indent=2), flush=True)
        assert net != sys.argv[3]
        assert os.getuid() == os.geteuid() == uid != 0
        assert os.getgid() == os.getegid() == gid
        assert len(links) == 1 and links[0]['ifname'] == 'lo' and 'UP' in links[0]['flags']
        assert all(r.get('dev') == 'lo' for r in routes4 + routes6)
        assert all(int(caps[k], 16) == 0 for k in caps if k.startswith('Cap'))
        assert caps['NoNewPrivs'] == '1' and not caps['Groups']
        assert set(os.environ) <= {'PATH','HOME','GBRAIN_HOME','TMPDIR','PWD','SHLVL','_','LC_CTYPE'}
        PY
        "$bun_path" --version > "$evidence/sandbox-bun-version.txt"
        test "$("$bun_path" --version)" = '1.3.13'
        # Three unchanged cases; retry retains its explicit 30000ms cap.
        set +e
        /usr/bin/time -v -o "$evidence/resource-usage.txt" \
          timeout --signal=TERM --kill-after=5s 90s \
          "$bun_path" test test/source-ingest-executor.test.ts \
          --test-name-pattern 'SQL transform aborts long-running work without blocking other JS timers|SQL transform rejects missing and null primary keys instead of row-N fallback|failed rows are retried on next transform run' \
          > "$evidence/test-output.txt" 2>&1
        rc=$?
        set -e
        printf '%s\n' "$rc" > "$evidence/exit-status.txt"
        python3 - "$evidence/resource-usage.txt" "$evidence/peak-rss-kib.txt" <<'PY'
        import pathlib, re, sys
        text = pathlib.Path(sys.argv[1]).read_text()
        match = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', text)
        pathlib.Path(sys.argv[2]).write_text((match.group(1) if match else 'unavailable') + '\n')
        PY
        cat "$evidence/test-output.txt"
        exit "$rc"
        USER
        # Only namespace setup has privilege; the complete test subtree is unprivileged.
        set +e
        sudo /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
          /usr/bin/unshare --net /bin/bash --noprofile --norc "$sandbox/root.sh" \
          "$runner_uid" "$runner_gid" "$sandbox" "$source_dir" "$EVIDENCE" "$host_net" "$bun_path" \
          > "$EVIDENCE/sandbox-output.txt" 2>&1
        rc=$?
        set -e
        printf '%s\n' "$rc" > "$EVIDENCE/sandbox-exit-status.txt"
        cat "$EVIDENCE/sandbox-output.txt"
        git -C "$source_dir" status --short > "$EVIDENCE/source-status-after.txt"
        exit "$rc"
    - name: Always upload diagnostic evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: timeout-control-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE }}
        if-no-files-found: error
        retention-days: 7
