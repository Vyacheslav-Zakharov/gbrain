# TEMPORARY: install ONLY as .github/workflows/test.yml on a diagnostics branch.
# Never merge this workflow into product. Bind SOURCE_SHA after exact-byte review.
# workflow_dispatch uses the already registered test.yml; new filenames may 404.
name: Markdown projection isolated recovery diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markdown-projection-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      SOURCE_SHA: 4844c2f45b4b615530524ccc88fc22cfd527fb2d
      EVIDENCE: ${{ github.workspace }}/markdown-projection-evidence
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Initialize evidence and refuse unbound source
        timeout-minutes: 1
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          for phase in red candidate engine; do
            printf 'not-run\n' > "$EVIDENCE/$phase.exit"
            printf 'not-run\n' > "$EVIDENCE/$phase.output"
          done
          printf 'pending\n' > "$EVIDENCE/cleanup.status"
          printf 'source=%s\nworkflow=%s\nrun=%s\nattempt=%s\n' "$SOURCE_SHA" "$WORKFLOW_SHA" "$RUN_ID" "$RUN_ATTEMPT" > "$EVIDENCE/identity.txt"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_ACTIONS" = true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 2
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 2
        with:
          bun-version: 1.3.13
      - name: Verify bytes and install frozen dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          unset DATABASE_URL
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain > "$EVIDENCE/source-status.txt"
          test ! -s "$EVIDENCE/source-status.txt"
          sha256sum scripts/markdown-projection-hosted-acceptance.ts docs/architecture/sql/markdown-projection-candidate.sql src/schema.sql bun.lock > "$EVIDENCE/source-sha256.txt"
          env -i PATH="$PATH" HOME="$HOME" CI=true timeout -k 5s 150s bun install --frozen-lockfile > "$EVIDENCE/install.output" 2>&1
      - name: Bounded offline worker regressions and typecheck
        timeout-minutes: 4
        run: |
          set -euo pipefail
          cd source
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 2s 30s bun test --config=/dev/null test/postgres-transaction-lifetime.test.ts > "$EVIDENCE/transaction-lifetime.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 2s 30s bun test --config=/dev/null test/postgres-transaction-facade.test.ts > "$EVIDENCE/transaction-facade.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 2s 30s bun test test/markdown-projection-worker-blockers.serial.test.ts > "$EVIDENCE/worker-blockers.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 2s 30s bun test scripts/markdown-projection-race-safety.test.ts test/markdown-projection-worker.test.ts test/markdown-projection.test.ts > "$EVIDENCE/worker-regression.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 5s 120s bun x --no-install tsc --noEmit > "$EVIDENCE/worker-typecheck.output" 2>&1
          timeout -k 3s 30s python3 -B scripts/markdown-projection-worker-crash-offline.py > "$EVIDENCE/crash-offline.output" 2>&1
          timeout -k 3s 30s python3 -B scripts/markdown-projection-engine-supervisor-offline.py > "$EVIDENCE/supervisor-offline.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 3s 30s bun test --config=/dev/null test/markdown-projection-worker-blockers.serial.test.ts test/markdown-projection-worker.test.ts scripts/markdown-projection-containment-healthy.test.ts scripts/markdown-projection-containment.test.ts scripts/markdown-projection-entrypoint.test.ts scripts/markdown-projection-receipt-validation.test.ts scripts/markdown-projection-clean-source.test.ts scripts/markdown-projection-fixture-fault.test.ts scripts/markdown-projection-isolated-recovery.test.ts scripts/markdown-projection-engine-offline.test.ts scripts/markdown-projection-race-safety.test.ts > "$EVIDENCE/isolated-regressions.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 3s 30s python3 -B scripts/markdown-projection-isolated-offline.py > "$EVIDENCE/isolated-process.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 3s 30s python3 -B scripts/markdown-projection-containment-offline.py > "$EVIDENCE/isolated-containment.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 3s 30s python3 -B scripts/markdown-projection-entrypoint-offline.py > "$EVIDENCE/isolated-wrapper.output" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-offline-home" timeout -k 5s 120s bun x --no-install tsc --noEmit --strict --skipLibCheck --module esnext --target esnext --moduleResolution bundler --allowImportingTsExtensions scripts/markdown-projection-containment-healthy.test.ts scripts/markdown-projection-containment.test.ts scripts/markdown-projection-engine-hosted.ts scripts/markdown-projection-entrypoint.test.ts scripts/markdown-projection-isolated-caller.ts scripts/markdown-projection-isolated-child-fixture.ts scripts/markdown-projection-isolated-worker.ts scripts/markdown-projection-receipt-validation.test.ts scripts/markdown-projection-clean-source.test.ts scripts/markdown-projection-fixture-fault.test.ts scripts/markdown-projection-isolated-recovery.test.ts scripts/markdown-projection-engine-offline.test.ts scripts/markdown-projection-race-safety.test.ts scripts/markdown-projection-fixture-fault.ts scripts/markdown-projection-isolated-recovery.ts > "$EVIDENCE/isolated-scripts-typecheck.output" 2>&1
          printf 'passed\n' > "$EVIDENCE/worker-offline.status"
      - name: Service identity and empty fixture baseline
        timeout-minutes: 1
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$SERVICE_ID" =~ ^[0-9a-f]{64}$ ]]
          timeout -k 5s 20s docker inspect --format '{{json .NetworkSettings.Networks}}' "$SERVICE_ID" > "$EVIDENCE/service-networks.json"
          python3 - <<'PY'
          import os, json, pathlib, ipaddress
          p = pathlib.Path(os.environ['EVIDENCE'])
          networks = json.loads((p/'service-networks.json').read_text())
          assert isinstance(networks, dict) and len(networks) == 1, 'missing or ambiguous service network'
          network, data = next(iter(networks.items()))
          address = data['IPAddress']
          assert str(ipaddress.IPv4Address(address)) == address, 'missing or noncanonical service IP'
          receipt = dict(service_id=os.environ['SERVICE_ID'], network=network, expected_service_ip=address, expected_service_port=5432, caller_endpoint='127.0.0.1:5432', provenance='docker inspect Actions service ID')
          (p/'topology-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          (p/'expected-service-ip').write_text(address+'\n')
          PY
          timeout -k 5s 20s docker exec "$SERVICE_ID" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atc 'SELECT version()' > "$EVIDENCE/postgres-version.txt"
          timeout -k 5s 20s docker exec "$SERVICE_ID" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM pg_database WHERE datname ~ '^mp_accept_[0-9a-f]{16}$'), (SELECT count(*) FROM pg_roles WHERE rolname ~ '^mp_accept_[0-9a-f]{16}_ordinary$')" > "$EVIDENCE/baseline.catalog"
          test "$(< "$EVIDENCE/baseline.catalog")" = '0|0'
      - name: RED missing-table proof and cleanup gate
        id: red
        timeout-minutes: 3
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          cd source
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-home" GITHUB_ACTIONS="$GITHUB_ACTIONS" MARKDOWN_PROJECTION_ADMIN_URL=postgres://postgres@127.0.0.1:5432/postgres MARKDOWN_PROJECTION_EXPECTED_SERVICE_IP="$(< "$EVIDENCE/expected-service-ip")" MARKDOWN_PROJECTION_DISPOSABLE=CREATE_AND_DROP_DATABASE MARKDOWN_PROJECTION_PHASE=red timeout -k 5s 120s bun run scripts/markdown-projection-hosted-acceptance.ts > "$EVIDENCE/red.output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE/red.exit"
          timeout -k 5s 20s docker exec "$SERVICE_ID" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM pg_database WHERE datname ~ '^mp_accept_[0-9a-f]{16}$'), (SELECT count(*) FROM pg_roles WHERE rolname ~ '^mp_accept_[0-9a-f]{16}_ordinary$')" > "$EVIDENCE/red-cleanup.catalog"
          test "$(< "$EVIDENCE/red-cleanup.catalog")" = '0|0'
          python3 - <<'PY'
          import os, pathlib, re, json
          p = pathlib.Path(os.environ['EVIDENCE'])
          out = (p/'red.output').read_text()
          receipts = []
          for line in out.splitlines():
              try: receipts.append(json.loads(line))
              except ValueError: pass
          cleanups = [r for r in receipts if isinstance(r, dict) and 'cleanup' in r]
          assert len(cleanups) == 1 and cleanups[0]['cleanup'] == 'passed' and cleanups[0]['cleanupErrors'] == [], 'RED fixture cleanup failed'
          assert (p/'red.exit').read_text().strip() == '1', 'RED must be assertion exit 1, not timeout/signal'
          assert re.search(r'(?:AssertionError[^\n]*|error:)\s*atomic obligation table missing', out), 'wrong RED error'
          assert 'ERR_ASSERTION' in out, 'not an assertion'
          assert re.search(r'actual:\s*null', out), 'actual must be null'
          assert re.search(r'''expected:\s*['"]markdown_projection_obligations['"]''', out), 'wrong expected table'
          (p/'red-verdict.txt').write_text('expected missing-table assertion; cleanup verified\n')
          PY
          printf 'expected=true\n' >> "$GITHUB_OUTPUT"
      - name: Candidate only after verified exact RED
        if: success() && steps.red.outputs.expected == 'true'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cd source
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/mp-home" GITHUB_ACTIONS="$GITHUB_ACTIONS" MARKDOWN_PROJECTION_ADMIN_URL=postgres://postgres@127.0.0.1:5432/postgres MARKDOWN_PROJECTION_EXPECTED_SERVICE_IP="$(< "$EVIDENCE/expected-service-ip")" MARKDOWN_PROJECTION_DISPOSABLE=CREATE_AND_DROP_DATABASE MARKDOWN_PROJECTION_PHASE=candidate timeout -k 5s 120s bun run scripts/markdown-projection-hosted-acceptance.ts > "$EVIDENCE/candidate.output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE/candidate.exit"
          test "$rc" -eq 0
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE'])
          receipts = []
          for line in (p/'candidate.output').read_text().splitlines():
              try: receipts.append(json.loads(line))
              except ValueError: pass
          passed = [r for r in receipts if isinstance(r, dict) and r.get('status') == 'passed' and r.get('phase') == 'candidate' and r.get('filesystemWorkerConnected') is False]
          assert len(passed) == 1, 'missing or ambiguous candidate final receipt'
          (p/'candidate-receipt.json').write_text(json.dumps(passed[0], indent=2)+'\n')
          PY
      - name: Install bounded namespace relay dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          timeout -k 5s 60s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update > "$EVIDENCE/relay-install.output" 2>&1
          timeout -k 5s 90s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y --no-install-recommends socat util-linux iproute2 python3 >> "$EVIDENCE/relay-install.output" 2>&1
          for tool in socat sudo unshare setpriv ip timeout bun python3; do command -v "$tool"; done > "$EVIDENCE/relay-tools.txt"
      - name: Real engine only inside bounded no-egress namespace
        timeout-minutes: 4
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git status --porcelain --untracked-files=all | tee "$EVIDENCE/engine-source-status-$(date +%s%N).txt"
          test -z "$(git status --porcelain)"
          sha256sum scripts/markdown-projection-engine-* > "$EVIDENCE/engine-source-sha256.txt"
          set +e
          env -i PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS=true MARKDOWN_PROJECTION_ADMIN_URL=postgres://postgres@127.0.0.1:5432/postgres MARKDOWN_PROJECTION_EXPECTED_SERVICE_IP="$(< "$EVIDENCE/expected-service-ip")" MARKDOWN_PROJECTION_DISPOSABLE=CREATE_AND_DROP_DATABASE MARKDOWN_PROJECTION_WORKER_MODE=isolated timeout -k 10s 210s bash scripts/markdown-projection-engine-hosted.sh > "$EVIDENCE/engine.output" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$EVIDENCE/engine.exit"
          test "$rc" -eq 0
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['EVIDENCE'])
          receipts = []
          for line in (p/'engine.output').read_text().splitlines():
              try: receipts.append(json.loads(line))
              except ValueError: pass
          receipts = [r for r in receipts if isinstance(r, dict)]
          for stage in ['namespace.admission','service.identity','baseline.catalog','candidate.catalog','baseline.complete','candidate.complete','worker.complete']:
              assert sum(r.get('stage') == stage for r in receipts) == 1, stage
          assert sum(r.get('stage') == 'worker.complete' and r.get('status') == 'passed' and r.get('filesystemWorkerConnected') is True and r.get('applicationAuthProven') is False for r in receipts) == 1
          assert sum(r.get('phase') == 'engine' and r.get('status') == 'passed' and r.get('filesystemWorkerConnected') is True and r.get('applicationAuthProven') is False for r in receipts) == 1
          final = [r for r in receipts if r.get('phase') == 'engine' and r.get('status') == 'passed']
          assert len(final) == 1 and final[0]['workerMode'] == 'isolated' and final[0]['isolatedHealthyCompletion'] is True
          assert final[0]['legacyRaces'] == 'excluded-not-passed' and final[0]['isolatedBackendLoss'] == 'passed'
          isolated = [r for r in receipts if r.get('stage') == 'worker.isolated' and r.get('status') == 'passed']
          assert len(isolated) == 1 and isolated[0]['connectionLossRecoveryProven'] is False
          receipt = isolated[0]['receipt']
          assert receipt['protocol'] == 'markdown-projection-reaping-v1' and receipt['final'] is True and receipt['status'] == 'passed' and receipt['copyStatus'] == 'materialized'
          assert 1 <= len(receipt['attempts']) <= 3
          assert all(a['reaped'] is True and a['exitCode'] == 0 and a['errors'] == [] and a['pid'] > 0 and a['runId'] == receipt['runId'] for a in receipt['attempts'])
          assert not any(r.get('stage') in ['worker.backend-race','worker.process-crash'] for r in receipts)
          acceptance = [r for r in receipts if r.get('stage') == 'worker.isolated.acceptance']
          assert len(acceptance) == 1 and acceptance[0]['status'] == 'passed'
          assert acceptance[0]['backendLoss'] == acceptance[0]['processCrash'] == acceptance[0]['newerGeneration'] == 'passed'
          recovery = [r for r in receipts if r.get('stage') == 'worker.isolated.recovery' and r.get('status') == 'passed']
          failures = [r for r in receipts if r.get('stage') == 'worker.isolated.failure' and r.get('status') == 'passed']
          expected = {('backend-loss','before_write'),('backend-loss','after_write'),('crash','after_write')}
          assert len(recovery) == len(failures) == 3
          assert {(r['mode'],r['seam']) for r in recovery} == {(r['mode'],r['seam']) for r in failures} == expected
          for r in recovery:
              failed, fresh = r['failedReceipt'], r['retryReceipt']
              assert r['reapedBeforeRetry'] is True and r['manualFilesUntouched'] is True
              assert failed['final'] is True and failed['status'] == 'failed' and len(failed['attempts']) == 1
              a = failed['attempts'][0]
              assert a['reaped'] is True and a['exitCode'] != 0 and a['pid'] > 0
              assert a['runId'] == failed['runId'] and a['errors']
              if r['mode'] == 'crash': assert a['exitCode'] == -9
              else: assert 'connection_closed' in a['errors'] or 'unhandled_error' in a['errors']
              assert fresh['final'] is True and fresh['status'] == 'passed' and fresh['copyStatus'] == 'materialized'
              assert fresh['runId'] != failed['runId'] and 1 <= len(fresh['attempts']) <= 3
              assert all(b['reaped'] is True and b['exitCode'] == 0 and b['errors'] == [] and b['pid'] > 0 and b['pid'] != a['pid'] and b['runId'] == fresh['runId'] for b in fresh['attempts'])
              matching = [f for f in failures if (f['mode'],f['seam']) == (r['mode'],r['seam'])]
              assert len(matching) == 1 and matching[0]['receipt'] == failed and matching[0]['currentAbsent'] is True
              assert r['currentPath'] and len(r['currentHash']) == 64
          (p/'isolated-recovery-receipts.json').write_text(json.dumps(recovery, indent=2)+'\n')
          cleanup = [r for r in receipts if 'cleanup' in r]
          assert len(cleanup) == 1 and cleanup[0]['cleanup'] == 'passed' and cleanup[0]['errors'] == []
          groups = [r for r in receipts if r.get('stage') == 'process.cleanup']
          # Sync healthy caller forwards supervisor stderr; async recovery captures it.
          # Every recovery child is covered by its validated final receipt, not a
          # fictional external cleanup line. Relay wrappers emit four other groups.
          starts = [r for r in receipts if r.get('stage') == 'worker.isolated.recovery' and r.get('status') == 'started']
          assert len(starts) == 3 and {(r['mode'], r['seam']) for r in starts} == expected
          finals = [receipt] + [f for r in recovery for f in (r['failedReceipt'], r['retryReceipt'])]
          assert len({f['runId'] for f in finals}) == len(finals), 'duplicate supervisor run'
          attempted = []
          for f in finals:
              assert f['protocol'] == 'markdown-projection-reaping-v1' and f['final'] is True
              assert isinstance(f['runId'], str) and f['runId']
              assert 1 <= len(f['attempts']) <= 3
              for number, a in enumerate(f['attempts'], 1):
                  assert a['attempt'] == number and a['runId'] == f['runId']
                  assert type(a['pid']) is int and a['pid'] > 0 and a['reaped'] is True
                  assert 'reaping_failed' not in a['errors']
                  attempted.append((f['runId'], a['pid']))
          assert len(set(attempted)) == len(attempted), 'duplicate child/run'
          assert len({pid for _, pid in attempted}) == len(attempted), 'duplicate child PID'
          assert all(r['status'] == 'passed' and r['members'] == [] and r['sessionMembers'] == [] for r in groups), 'unreaped external group'
          group_ids = [r['pgid'] for r in groups]
          assert all(type(pid) is int and pid > 0 for pid in group_ids)
          assert len(set(group_ids)) == len(group_ids), 'duplicate external group'
          healthy_ids = {a['pid'] for a in receipt['attempts']}
          recovery_ids = {pid for _, pid in attempted} - healthy_ids
          assert healthy_ids <= set(group_ids), 'missing healthy child group'
          assert not recovery_ids.intersection(group_ids), 'unexpected forwarded async group'
          relay_ids = set(group_ids) - healthy_ids
          assert len(relay_ids) == 4 and len(groups) == len(healthy_ids) + 4, 'relay group inventory'
          (p/'reaping-inventory.json').write_text(json.dumps(dict(attempted=attempted, externalGroups=group_ids, relayGroups=sorted(relay_ids)), indent=2)+'\n')
          (p/'engine-receipts.json').write_text(json.dumps(receipts, indent=2)+'\n')
          PY
          git status --porcelain --untracked-files=all | tee "$EVIDENCE/engine-source-status-$(date +%s%N).txt"
          test -z "$(git status --porcelain)"
      - name: Always verify fixture cleanup and remove service
        if: always()
        timeout-minutes: 2
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE"
          timeout -k 5s 20s docker exec "$SERVICE_ID" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM pg_database WHERE datname ~ '^mp_accept_[0-9a-f]{16}$'), (SELECT count(*) FROM pg_roles WHERE rolname ~ '^mp_accept_[0-9a-f]{16}_ordinary$')" > "$EVIDENCE/final-cleanup.catalog" 2> "$EVIDENCE/final-cleanup.error"
          probe=$?
          timeout -k 5s 15s docker logs "$SERVICE_ID" > "$EVIDENCE/service.log" 2>&1
          timeout -k 5s 30s docker rm -f "$SERVICE_ID" > "$EVIDENCE/service-remove.output" 2>&1
          removed=$?
          timeout -k 5s 10s docker ps -a --filter "id=$SERVICE_ID" --format '{{.ID}}' > "$EVIDENCE/service-remaining.txt" 2> "$EVIDENCE/service-remaining.error"
          listed=$?
          printf 'catalog_exit=%s\nremove_exit=%s\nlist_exit=%s\n' "$probe" "$removed" "$listed" > "$EVIDENCE/cleanup.status"
          test "$probe" -eq 0 && test "$(< "$EVIDENCE/final-cleanup.catalog")" = '0|0' && test "$removed" -eq 0 && test "$listed" -eq 0 && test ! -s "$EVIDENCE/service-remaining.txt"
      - name: Always retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 2
        with:
          name: markdown-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
