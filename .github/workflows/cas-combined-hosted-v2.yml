name: CAS Combined Narrow PostgreSQL
on:
  push:
    branches: [acceptance/cas-combined-safe-tx-v3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cas-combined-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare isolated configuration and exact-source evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/cas-home" cas-evidence
          printf 'GBRAIN_HOME=%s\n' "$RUNNER_TEMP/cas-home" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD > cas-evidence/source-sha.txt
          printf '%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > cas-evidence/run.txt
          printf '%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" > cas-evidence/workflow.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > cas-evidence/source-files.sha256
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies without host postinstall
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify packaged combined bytes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          rows=json.loads(pathlib.Path('test/e2e/helpers/cas-combined-source.json').read_text())
          assert len(rows)==2960
          assert all(hashlib.sha256(pathlib.Path(k).read_bytes()).hexdigest()==v for k,v in rows.items())
          pathlib.Path('cas-evidence/combined-parity.json').write_text(json.dumps({'files':len(rows),'allEqual':True,'manifestSha256':hashlib.sha256(pathlib.Path('test/e2e/helpers/cas-combined-source.json').read_bytes()).hexdigest()}))
          PY
      - name: Verify exact driver and offline transaction lifecycle
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          expected = {'package.json': '944d492614959389a5739ef2893bc1830fb773ff042159d9b331d43b2f6792e9', 'src/index.js': '4e21f5733e70d79cffc10d10d4ef01031de4a9ac862210e43f8870029fd103ed', 'src/connection.js': 'ee3a218d9aa6a6f2887c1a19da50009335fe84c11a5431d5cab72d6bc528632f', 'src/query.js': '67c45a5151032aa46b587abc15381fe4efd97c696e5c1b53082b8161309c4ee2'}
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path('node_modules/postgres', path).read_bytes()).hexdigest() == digest, path
          PY
          for suite in test/postgres-reservation-lifetime.test.ts test/postgres-transaction-lifetime.test.ts test/postgres-transaction-facade.test.ts test/postgres-engine-getter-selfheal.test.ts test/postgres-engine-singleton-ownership.test.ts test/page-file-connected-lifecycle.serial.test.ts test/page-file-lifecycle-races.serial.test.ts test/cas-combined-transaction-order.test.ts; do
            timeout --signal=TERM --kill-after=5s 90s bun test "$suite"
          done
      - name: Typecheck exact combined candidate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: timeout --signal=TERM --kill-after=10s 180s bun run typecheck
      - name: Prepare disposable protected bootstrap directory
        run: |
          test "$GITHUB_ACTIONS" = true
          test ! -e /etc/gbrain
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /etc/gbrain
          touch "$RUNNER_TEMP/cas-owned-directory"
      - name: Narrow combined PostgreSQL acceptance
        env:
          DATABASE_URL: postgresql://postgres:disposable-test-only@localhost:5432/gbrain_test
          REQUIRE_PAGE_FILE_FRESH_CATALOG_POSTGRES: '1'
          REQUIRE_PAGE_FILE_SQL_AUTHORITY_POSTGRES: '1'
          REQUIRE_PAGE_FILE_UPGRADE_REPLAY_POSTGRES: '1'
          REQUIRE_PAGE_FILE_CONNECTED_POSTGRES: '1'
          PAGE_FILE_CAS_DISPOSABLE: '1'
          PAGE_FILE_SQL_EVIDENCE_DIR: cas-evidence
        run: |
          set -o pipefail
          set +e
          env -u GBRAIN_DIRECT_DATABASE_URL timeout --signal=TERM --kill-after=10s 300s bun test --timeout 180000 test/e2e/cas-combined-hosted.test.ts 2>&1 | tee cas-evidence/combined.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > cas-evidence/combined-exit.txt
          exit "$rc"
      - name: Verify result and source
        if: always()
        run: |
          git diff --exit-code
          sha256sum --check cas-evidence/source-files.sha256 > cas-evidence/source-verification.txt
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('cas-evidence')
          assert (p/'combined-exit.txt').read_text().strip()=='0'
          log=(p/'combined.log').read_text()
          for marker in ['CAS_COMBINED: real transaction success', 'CAS_COMBINED: Markdown remains unconfigured', 'PG_CONNECTED_BOOTSTRAP: operator-only enrollment; disconnect tombstone and same-engine reconnect', 'PG_CONNECTED_BOOTSTRAP: per-borrow ordinary and adapter drift denied; no catalog self-repair', 'PG_CONNECTED_BOOTSTRAP: protected fixed anchor drift denied without mutation']:
              assert log.count(marker)==1, marker
          assert not list(pathlib.Path('/etc/gbrain').iterdir()), 'protected fixture residue'
          PY
      - name: Remove empty disposable protected directory
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil
          root=pathlib.Path('/etc/gbrain')
          assert pathlib.Path(os.environ['RUNNER_TEMP'],'cas-owned-directory').exists()
          entries=list(root.iterdir()) if root.exists() else []
          assert all(p.name=='page-file-bootstrap-anchor.json' or p.name.startswith('connected-fixture-') for p in entries)
          receipt={'residueBeforeCleanup':sorted(p.name for p in entries)}
          for p in entries:
              if p.is_dir() and not p.is_symlink(): shutil.rmtree(p)
              else: p.unlink()
          receipt['remainingEntries']=sorted(p.name for p in root.iterdir()) if root.exists() else []
          pathlib.Path('cas-evidence/protected-cleanup.json').write_text(json.dumps(receipt))
          assert receipt['remainingEntries']==[]
          PY
          if test -d /etc/gbrain; then sudo rmdir /etc/gbrain; fi
          test ! -e /etc/gbrain
      - name: Bind evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '%s\n' "$JOB_STATUS" > cas-evidence/job-status.txt
          printf '%s\n' 'Synthetic hosted-only narrow compatibility. No production data/config/authorization. Unrelated matrices excluded, not passed.' > cas-evidence/scope.txt
          sha256sum cas-evidence/* > cas-evidence-checksums.txt
          mv cas-evidence-checksums.txt cas-evidence/evidence.sha256
      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cas-combined-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cas-evidence/
          if-no-files-found: error
