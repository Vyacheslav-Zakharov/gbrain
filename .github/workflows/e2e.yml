name: Reconciliation E2E (verification only)
'on':
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  e2e:
    name: Original E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --cpus 2 --memory 2g --pids-limit 256
          --health-cmd "pg_isready -U postgres -d gbrain_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PRODUCT_BASE_SHA: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
      EXPECTED_SHA: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
      SHARD: ${{ matrix.shard }}/4
      DATABASE_URL: postgresql://postgres:ephemeral_test_only@127.0.0.1:5432/gbrain_test
      EVIDENCE: ${{ github.workspace }}/e2e-evidence
      LC_ALL: C
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Discover exact original shard and check prerequisites
        run: |
          mkdir -p "$EVIDENCE" "$RUNNER_TEMP/isolated-home"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ['PRODUCT_BASE_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          allowed = set()  # exact approved source checkout; zero changed paths
          unexpected = sorted(set(changed) - allowed)
          receipt = dict(productBaseSHA=base, fixtureSHA=os.environ['EXPECTED_SHA'], workflowSHA=os.environ['GITHUB_SHA'], changedFiles=changed, unexpectedFiles=unexpected, productBytesUnchanged=not unexpected)
          pathlib.Path(os.environ['EVIDENCE'], 'product-parity.json').write_text(json.dumps(receipt, indent=2)+'\n')
          assert not unexpected, unexpected
          PY
          test "$(bun --version)" = 1.3.13
          command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;' -c 'SHOW server_version;'
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/isolated-home" LC_ALL=C SHARD="$SHARD" bash scripts/run-e2e.sh --dry-run-list > "$EVIDENCE/inventory.txt"
          test -s "$EVIDENCE/inventory.txt"
          git diff --exit-code HEAD --
      - name: Frozen install (no cache restore)
        id: install
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/isolated-home" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C timeout --signal=TERM --kill-after=30s 6m bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
          git diff --exit-code HEAD --
      - name: Original test command with finite process-group deadline
        id: tests
        run: |
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/isolated-home" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C DATABASE_URL="$DATABASE_URL" SHARD="$SHARD" timeout --signal=TERM --kill-after=10s 30m bun run test:e2e 2>&1 | tee "$EVIDENCE/e2e.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$EVIDENCE/exit-code.txt"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0
      - name: Receipt and postrun tracked drift (never reset)
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          p = pathlib.Path(os.environ['EVIDENCE']); p.mkdir(parents=True, exist_ok=True)
          def git(*args):
              r = subprocess.run(['git', *args], capture_output=True, text=True)
              return r.returncode, r.stdout, r.stderr
          rc, sha, error = git('rev-parse', 'HEAD')
          drc, drift, derr = git('diff', '--name-status', 'HEAD', '--')
          _, porcelain, _ = git('status', '--porcelain=v1', '--untracked-files=no')
          inventory = (p/'inventory.txt').read_text().splitlines() if (p/'inventory.txt').exists() else []
          code = int((p/'exit-code.txt').read_text()) if (p/'exit-code.txt').exists() else None
          clean = drc == 0 and not drift and not porcelain
          ok = rc == 0 and sha.strip() == os.environ['EXPECTED_SHA'] and clean and bool(inventory) and code == 0 and os.environ['TEST_OUTCOME'] == 'success' and os.environ['INSTALL_OUTCOME'] == 'success'
          receipt = dict(expectedSourceSHA=os.environ['EXPECTED_SHA'], actualCheckoutSHA=sha.strip(), workflowSHA=os.environ.get('GITHUB_SHA'), runId=os.environ.get('GITHUB_RUN_ID'), runAttempt=os.environ.get('GITHUB_RUN_ATTEMPT'), shard=os.environ['SHARD'], discoveredFiles=inventory, discoveredCount=len(inventory), testOutcome=os.environ['TEST_OUTCOME'], installOutcome=os.environ['INSTALL_OUTCOME'], exitCode=code, status='success' if ok else 'failed-or-incomplete', trackedDrift=drift, trackedStatus=porcelain, driftReadError=derr, checkoutReadError=error, coverageClaim='none; discovery is not execution; skipped/provider-gated cases are not covered')
          log = (p/'e2e.log').read_text(errors='replace') if (p/'e2e.log').exists() else ''
          starts = re.findall(r'^=== (.+\.test\.ts) ===$', log, re.M)
          summary = re.findall(r'^Files: (\d+) total, (\d+) passed, (\d+) failed$', log, re.M)
          receipt.update(observedFileStarts=starts, observedFileStartCount=len(starts), completedFileSummary=summary[-1] if summary else None, invocationEvidence='original runner file-start markers; not proof of completed tests')
          receipt['evidenceSHA256'] = {f.name: hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.iterdir()) if f.is_file() and f.name != 'receipt.json'}
          receipt['sourceTree'] = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          (p/'receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          raise SystemExit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reconciliation-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
