name: Supplemental skipped-suite gates (verification only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  pgbouncer-teardown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
      EVIDENCE: ${{ github.workspace }}/supplemental-evidence/pgbouncer-teardown
      SUITE: pgbouncer-teardown
      EXPECTED_TESTS: '["op against the pooled URL exits clean — output intact, no force-exit banner", "second run (warm schema
        probe) also exits clean through the pooler"]'
      LC_ALL: C
      DIRECT_URL: postgresql://postgres:ci_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:5432/gbrain_test
      POOLED_URL: postgresql://postgres:ci_${{ github.run_id }}_${{ github.run_attempt }}@127.0.0.1:6543/gbrain_pgbouncer
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
        path: source
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - name: Freeze clean source and execution prerequisites
      run: |
        export CLEAN_HOME="$RUNNER_TEMP/supplemental-home"
        printf 'CLEAN_HOME=%s\n' "$CLEAN_HOME" >> "$GITHUB_ENV"
        mkdir -p "$EVIDENCE" "$CLEAN_HOME"
        test -z "$(ls -A "$CLEAN_HOME")"
        cd source
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        test "$(bun --version)" = 1.3.13
        printf '%s\n' "$(command -v bun)" > "$EVIDENCE/bun-path.txt"
        git status --porcelain=v1 --untracked-files=all > "$EVIDENCE/pre-status.txt"
        sha256sum docker-compose.ci.yml "test/e2e/$SUITE.test.ts" bun.lock > "$EVIDENCE/source-files.sha256"
    - name: Frozen source dependencies
      id: install
      run: |
        cd source
        env -i PATH="$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C timeout --signal=TERM --kill-after=10s 3m bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
    - name: Prove service-only destructive target and pool mode
      id: topology
      env:
        PG_ID: ${{ job.services.postgres.id }}
        POOL_ID: ${{ job.services.pgbouncer.id }}
      run: |
        cd source
        python3 - <<'PY'
        import os,json,subprocess,configparser
        from urllib.parse import urlparse
        p=json.loads(subprocess.check_output(['docker','inspect',os.environ['PG_ID']]))[0]
        b=json.loads(subprocess.check_output(['docker','inspect',os.environ['POOL_ID']]))[0]
        assert p['State']['Running'] and b['State']['Running']
        assert set(p['NetworkSettings']['Networks']) == set(b['NetworkSettings']['Networks'])
        assert len(p['NetworkSettings']['Networks']) == 1
        assert 'postgres' in next(iter(p['NetworkSettings']['Networks'].values()))['Aliases']
        for key,port,db in [('DIRECT_URL',5432,'gbrain_test'),('POOLED_URL',6543,'gbrain_pgbouncer')]:
         u=urlparse(os.environ[key]); assert u.scheme=='postgresql' and u.hostname=='127.0.0.1' and u.port==port and u.path=='/'+db and not u.query and not u.fragment
        for obj,port in [(p,'5432'),(b,'6543')]:
         assert obj['NetworkSettings']['Ports']['5432/tcp']==[{'HostIp':'127.0.0.1','HostPort':port}]
        text=subprocess.check_output(['docker','exec',os.environ['POOL_ID'],'cat','/etc/pgbouncer/pgbouncer.ini'],text=True)
        c=configparser.ConfigParser(interpolation=None); c.read_string(text)
        assert c['pgbouncer']['pool_mode']=='transaction'
        assert 'host=postgres' in c['databases']['*'] and 'port=5432' in c['databases']['*']
        assert set(c['pgbouncer']['ignore_startup_parameters'].replace(' ','').split(',')) >= {'extra_float_digits','statement_timeout','idle_in_transaction_session_timeout','search_path'}
        receipt={'postgresImage':p['Config']['Image'],'postgresImageId':p['Image'],'poolImage':b['Config']['Image'],'poolImageId':b['Image'],'sameJobNetwork':True,'loopbackOnly':True,'poolMode':'transaction','dedicatedDestructiveDatabase':'gbrain_pgbouncer'}
        open(os.environ['EVIDENCE']+'/topology.json','w').write(json.dumps(receipt,indent=2))
        PY
        env -i PATH="$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" DIRECT_URL="$DIRECT_URL" POOLED_URL="$POOLED_URL" timeout --signal=TERM --kill-after=10s 45s bun -e '
        import postgres from "postgres";
        const direct=postgres(process.env.DIRECT_URL,{max:1});
        const u=new URL(process.env.POOLED_URL);u.pathname="/gbrain_test";
        const pool=postgres(u.toString(),{max:1});
        try { const a=await direct`select system_identifier::text as id from pg_control_system()`; const b=await pool`select system_identifier::text as id from pg_control_system()`; if(a[0].id!==b[0].id) throw Error("different PostgreSQL clusters"); await direct`CREATE EXTENSION IF NOT EXISTS vector`; console.log(JSON.stringify({sameCluster:true,systemIdentifier:a[0].id})); } finally {await pool.end({timeout:3});await direct.end({timeout:3});}' > "$EVIDENCE/cluster-proof.json"
    - name: Direct narrow suite (never run-e2e scrub wrapper)
      id: tests
      run: |
        cd source
        set +e
        env -i PATH="$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C GBRAIN_PGBOUNCER_DIRECT_URL="$DIRECT_URL" GBRAIN_PGBOUNCER_URL="$POOLED_URL" timeout --signal=TERM --kill-after=10s 6m bun test "./test/e2e/$SUITE.test.ts" --reporter=junit --reporter-outfile="$EVIDENCE/junit.xml" 2>&1 | tee "$EVIDENCE/test.log"
        codes=("${PIPESTATUS[@]}")
        printf '%s\n' "${codes[0]}" > "$EVIDENCE/exit-code.txt"
        test "${codes[0]}" = 0 && test "${codes[1]}" = 0
    - name: Fail-closed JUnit and exact-identity receipt
      if: always()
      env:
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        TOPOLOGY_OUTCOME: ${{ steps.topology.outcome }}
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        python3 - <<'PY'
        import os,json,pathlib,subprocess,xml.etree.ElementTree as ET,collections
        p=pathlib.Path(os.environ['EVIDENCE']);p.mkdir(parents=True,exist_ok=True)
        r={'expectedSourceSHA':os.environ['EXPECTED_SHA'],'workflowSHA':os.environ['WORKFLOW_SHA'],'workflowRef':os.environ['WORKFLOW_REF'],'eventSHA':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':os.environ['GITHUB_JOB'],'suite':os.environ['SUITE'],'installOutcome':os.environ['INSTALL_OUTCOME'],'topologyOutcome':os.environ['TOPOLOGY_OUTCOME'],'testOutcome':os.environ['TEST_OUTCOME'],'status':'failed-or-incomplete'}
        try:
         def git(*args):return subprocess.check_output(['git','-C','source',*args],text=True)
         r['actualSourceSHA']=git('rev-parse','HEAD').strip()
         r['trackedDrift']=git('diff','--name-status','HEAD','--')
         r['postStatus']=git('status','--porcelain=v1','--untracked-files=all')
         r['preStatus']=(p/'pre-status.txt').read_text()
         r['exitCode']=int((p/'exit-code.txt').read_text())
         root=ET.parse(p/'junit.xml').getroot();cases=root.findall('.//testcase')
         names=[c.attrib.get('name','') for c in cases];expected=json.loads(os.environ['EXPECTED_TESTS'])
         r.update(expectedTests=expected,observedTests=names)
         assert len(cases)==len(expected) and collections.Counter(names)==collections.Counter(expected), 'JUnit exact behavioral inventory mismatch'
         assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
         for el in root.iter():
          for attr in ['skipped','failures','errors','disabled']:assert int(el.attrib.get(attr,0))==0
         assert r['actualSourceSHA']==r['expectedSourceSHA'] and not r['trackedDrift'] and not r['postStatus'] and not r['preStatus']
         assert r['exitCode']==0 and all(r[k]=='success' for k in ['installOutcome','topologyOutcome','testOutcome'])
         assert r['workflowSHA'] and r['workflowRef'] and r['runId'] and r['runAttempt']
         r['status']='success'
        except Exception as e:r['validationError']=repr(e)
        (p/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
        raise SystemExit(0 if r['status']=='success' else 1)
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: supplemental-pgbouncer-teardown-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE }}/
        if-no-files-found: error
        retention-days: 14
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: gbrain_test
        ports:
        - 127.0.0.1:5432:5432
        options: --cpus 2 --memory 2g --pids-limit 256 --health-cmd "pg_isready -U postgres -d gbrain_test" --health-interval
          5s --health-timeout 3s --health-retries 15
      pgbouncer:
        image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          POOL_MODE: transaction
          AUTH_TYPE: plain
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '10'
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,statement_timeout,idle_in_transaction_session_timeout,search_path
        ports:
        - 127.0.0.1:6543:5432
        options: --cpus 1 --memory 256m --pids-limit 128
  connect-bearer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
      EVIDENCE: ${{ github.workspace }}/supplemental-evidence/connect-bearer
      SUITE: connect-bearer
      EXPECTED_TESTS: '["real bearer token round-trips get_brain_identity", "wrong token classifies as auth", "unreachable
        host classifies as unreachable or timeout", "claude-code --install registers + connects against the live server",
        "codex --install registers the env-var bearer against the live server", "perplexity print mode yields the GUI connector
        values (no CLI to wire E2E)", "perplexity OAuth: connect --oauth → mint client-credentials token → tool call"]'
      LC_ALL: C
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: 72eecabc654fcb1f1221d4b7375b80ab0a2223f0
        path: source
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.13
    - name: Freeze clean source and execution prerequisites
      run: |
        export CLEAN_HOME="$RUNNER_TEMP/supplemental-home"
        printf 'CLEAN_HOME=%s\n' "$CLEAN_HOME" >> "$GITHUB_ENV"
        mkdir -p "$EVIDENCE" "$CLEAN_HOME"
        test -z "$(ls -A "$CLEAN_HOME")"
        cd source
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        test "$(bun --version)" = 1.3.13
        printf '%s\n' "$(command -v bun)" > "$EVIDENCE/bun-path.txt"
        git status --porcelain=v1 --untracked-files=all > "$EVIDENCE/pre-status.txt"
        sha256sum docker-compose.ci.yml "test/e2e/$SUITE.test.ts" bun.lock > "$EVIDENCE/source-files.sha256"
    - name: Frozen source dependencies
      id: install
      run: |
        cd source
        env -i PATH="$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C timeout --signal=TERM --kill-after=10s 3m bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE/install.log"
    - name: Pinned credential-free CLI installation (hosted only)
      id: topology
      run: |
        env -i PATH="$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C timeout --signal=TERM --kill-after=10s 3m npm install --global --prefix "$RUNNER_TEMP/cli" --registry=https://registry.npmjs.org --no-audit --no-fund @anthropic-ai/claude-code@2.1.266 @openai/codex@0.153.4 2>&1 | tee "$EVIDENCE/cli-install.log"
        env -i PATH="$PATH" HOME="$CLEAN_HOME" npm list --global --prefix "$RUNNER_TEMP/cli" --json > "$EVIDENCE/cli-installed.json"
        node -e 'const p=process.argv[1]; for(const [n,v] of [["@anthropic-ai/claude-code","2.1.266"],["@openai/codex","0.153.4"]]) {if(require(p+"/lib/node_modules/"+n+"/package.json").version!==v) process.exit(1)}' "$RUNNER_TEMP/cli"
    - name: Direct narrow suite (never run-e2e scrub wrapper)
      id: tests
      run: |
        cd source
        runner_uid="$(id -u)"
        runner_gid="$(id -g)"
        test "$runner_uid" != 0
        bun_path="$(command -v bun)"
        test "${bun_path:0:1}" = /
        # The script and proof live outside the pinned source checkout.
        cat > "$EVIDENCE/namespace-suite.sh" <<'SH'
        set -euo pipefail
        /usr/bin/python3 - <<'PY'
        import os,json,pathlib,subprocess
        links=json.loads(subprocess.check_output(['/usr/sbin/ip','-j','link','show']))
        routes={v:json.loads(subprocess.check_output(['/usr/sbin/ip','-j',v,'route','show','table','all'])) for v in ['-4','-6']}
        status=dict(line.split(':',1) for line in pathlib.Path('/proc/self/status').read_text().splitlines() if ':' in line)
        netns=os.readlink('/proc/self/ns/net')
        assert netns!=os.environ['HOST_NETNS'], 'network namespace was not isolated'
        assert [x['ifname'] for x in links]==['lo'] and 'UP' in links[0]['flags']
        assert all(r.get('dev')=='lo' for rs in routes.values() for r in rs), 'non-loopback route'
        assert os.getuid()==int(os.environ['RUNNER_UID'])!=0 and os.getgid()==int(os.environ['RUNNER_GID'])
        assert int(status['NoNewPrivs'].strip())==1
        assert all(int(status[k].strip(),16)==0 for k in ['CapInh','CapPrm','CapEff','CapBnd','CapAmb'])
        proof={'uid':os.getuid(),'gid':os.getgid(),'netns':netns,'hostNetns':os.environ['HOST_NETNS'],'links':links,'routes':routes,'noNewPrivileges':True,'capabilitiesEmpty':True,'loopbackOnly':True}
        pathlib.Path(os.environ['EVIDENCE'],'namespace-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
        PY
        exec /usr/bin/timeout --signal=TERM --kill-after=10s 6m "$1" test "$2" --reporter=junit --reporter-outfile="$3"
        SH
        set +e
        # Root only creates the netns/enables lo; suite runs as runner without capabilities.
        sudo /usr/bin/unshare --net -- /bin/bash -c '/usr/sbin/ip link set lo up && exec "$@"' _ /usr/bin/setpriv --reuid="$runner_uid" --regid="$runner_gid" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs /usr/bin/env -i PATH="$RUNNER_TEMP/cli/bin:$PATH" HOME="$CLEAN_HOME" TMPDIR="$RUNNER_TEMP" CI=true LC_ALL=C EVIDENCE="$EVIDENCE" RUNNER_UID="$runner_uid" RUNNER_GID="$runner_gid" HOST_NETNS="$(readlink /proc/self/ns/net)" DISABLE_AUTOUPDATER=1 DISABLE_TELEMETRY=1 DISABLE_ERROR_REPORTING=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 /bin/bash "$EVIDENCE/namespace-suite.sh" "$bun_path" "./test/e2e/$SUITE.test.ts" "$EVIDENCE/junit.xml" 2>&1 | tee "$EVIDENCE/test.log"
        codes=("${PIPESTATUS[@]}")
        printf '%s\n' "${codes[0]}" > "$EVIDENCE/exit-code.txt"
        test "${codes[0]}" = 0 && test "${codes[1]}" = 0
    - name: Fail-closed JUnit and exact-identity receipt
      if: always()
      env:
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        TOPOLOGY_OUTCOME: ${{ steps.topology.outcome }}
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        python3 - <<'PY'
        import os,json,pathlib,subprocess,xml.etree.ElementTree as ET,collections
        p=pathlib.Path(os.environ['EVIDENCE']);p.mkdir(parents=True,exist_ok=True)
        r={'expectedSourceSHA':os.environ['EXPECTED_SHA'],'workflowSHA':os.environ['WORKFLOW_SHA'],'workflowRef':os.environ['WORKFLOW_REF'],'eventSHA':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'job':os.environ['GITHUB_JOB'],'suite':os.environ['SUITE'],'installOutcome':os.environ['INSTALL_OUTCOME'],'topologyOutcome':os.environ['TOPOLOGY_OUTCOME'],'testOutcome':os.environ['TEST_OUTCOME'],'status':'failed-or-incomplete'}
        try:
         def git(*args):return subprocess.check_output(['git','-C','source',*args],text=True)
         r['actualSourceSHA']=git('rev-parse','HEAD').strip()
         r['trackedDrift']=git('diff','--name-status','HEAD','--')
         r['postStatus']=git('status','--porcelain=v1','--untracked-files=all')
         r['preStatus']=(p/'pre-status.txt').read_text()
         r['exitCode']=int((p/'exit-code.txt').read_text())
         root=ET.parse(p/'junit.xml').getroot();cases=root.findall('.//testcase')
         names=[c.attrib.get('name','') for c in cases];expected=json.loads(os.environ['EXPECTED_TESTS'])
         r.update(expectedTests=expected,observedTests=names)
         assert len(cases)==len(expected) and collections.Counter(names)==collections.Counter(expected), 'JUnit exact behavioral inventory mismatch'
         assert not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
         for el in root.iter():
          for attr in ['skipped','failures','errors','disabled']:assert int(el.attrib.get(attr,0))==0
         assert r['actualSourceSHA']==r['expectedSourceSHA'] and not r['trackedDrift'] and not r['postStatus'] and not r['preStatus']
         assert r['exitCode']==0 and all(r[k]=='success' for k in ['installOutcome','topologyOutcome','testOutcome'])
         assert r['workflowSHA'] and r['workflowRef'] and r['runId'] and r['runAttempt']
         r['status']='success'
        except Exception as e:r['validationError']=repr(e)
        (p/'receipt.json').write_text(json.dumps(r,indent=2)+'\n')
        raise SystemExit(0 if r['status']=='success' else 1)
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: supplemental-connect-bearer-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE }}/
        if-no-files-found: error
        retention-days: 14
