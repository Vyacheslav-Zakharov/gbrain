name: Directory pilot qualification
on:
  workflow_dispatch:
  push:
    branches: ['feat/toir-source-ingest-guard-20260925']
permissions:
  contents: read
concurrency:
  group: directory-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: gbrain_directory_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exact source identity
        run: git rev-parse HEAD
      - name: Dedicated PostgreSQL native executor qualification
        env:
          DATABASE_URL: postgresql://postgres:fixture-only@localhost:5432/gbrain_directory_guard_test
          GBRAIN_DIRECTORY_GUARD_PG_TEST: '1'
          GBRAIN_TEST_MODE: '1'
        run: |
          export HOME="$(mktemp -d)"
          export GBRAIN_HOME="$HOME/.gbrain"
          mkdir -p "$GBRAIN_HOME"
          bun -e 'import {PostgresEngine} from "./src/core/postgres-engine.ts"; const u=new URL(process.env.DATABASE_URL!); if(u.hostname!=="localhost"||u.pathname!=="/gbrain_directory_guard_test") throw Error("wrong fixture"); const e=new PostgresEngine(); try {await e.connect({database_url:u.toString()}); await e.initSchema();} finally {await e.disconnect();}'
          bun test test/e2e/source-ingest-directory-guard.test.ts --timeout 120000 --max-concurrency 1
