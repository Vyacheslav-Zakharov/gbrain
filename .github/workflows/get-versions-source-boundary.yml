name: Get versions source boundary
on:
  workflow_dispatch:
  push:
    branches: [fix/get-versions-source-aware-20260924]
permissions:
  contents: read
concurrency:
  group: versions-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gbrain_versions_test
        ports: ['5432:5432']
        options: >-
          --memory=1g --memory-swap=1g --cpus=2 --pids-limit=256
          --health-cmd="pg_isready -U postgres -d gbrain_versions_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exact revision and isolated config
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/versions-home"
          echo "GBRAIN_HOME=$RUNNER_TEMP/versions-home" >> "$GITHUB_ENV"
          git rev-parse HEAD
      - name: Focused unit contracts
        run: timeout -k 10s 120s bun test test/get-versions-source-scope.test.ts test/source-scope-resolver.test.ts test/parity.test.ts
      - name: Existing privacy and federated read regressions (separate processes)
        run: |
          timeout -k 10s 120s bun test test/get-page-federated-scope.test.ts
          timeout -k 10s 120s bun test --timeout 60000 test/takes-fence-read-ops.serial.test.ts
          timeout -k 10s 120s bun test --timeout 60000 test/takes-mcp-allowlist.serial.test.ts
      - name: Isolated real Postgres dispatch boundary
        env:
          GBRAIN_VERSIONS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gbrain_versions_test
        run: timeout -k 10s 180s bun test test/e2e/get-versions-source-scope.test.ts
      - name: Typecheck and affected static guards
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          timeout -k 10s 120s bun run typecheck
          bash scripts/check-test-isolation.sh
          bash scripts/check-operations-filter-bypass.sh
          git diff --check
